# IMPLEMENTED (local): the runnable demo and the FastAPI foundation.
# PLANNED: remote hosting; no deployed service or production readiness is implied.
# No secrets, live providers, or durable database are configured by this file.
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PROOFLINE_ENV: development
      PROOFLINE_DEV_AUTH: "false"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
